<svg width="850" height="38" viewBox="0 0 850 38" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes tickerMarquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .marquee-track {
        animation: tickerMarquee 22s linear infinite;
      }
      .marquee-track:hover {
        animation-play-state: paused;
      }
    </style>
    <clipPath id="tickerClip">
      <rect x="2" y="2" width="846" height="34" rx="7" />
    </clipPath>
  </defs>

