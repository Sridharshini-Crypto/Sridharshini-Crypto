<svg width="850" height="150" viewBox="0 0 850 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="850" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050907" />
      <stop offset="50%" stop-color="#07100B" />
      <stop offset="100%" stop-color="#040705" />
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Glowing Scan Line Gradient -->
    <linearGradient id="glowScan" x1="0" y1="0" x2="850" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.9; }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.85); }
      }
      @keyframes scanMove {
        0% { transform: translateX(-850px); }
        100% { transform: translateX(850px); }
      }
      @keyframes typeBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .pulsing-border {
        animation: pulseGlow 3s ease-in-out infinite;
      }
      .radar-dot {
        animation: blinkDot 1.8s ease-in-out infinite;
        transform-origin: 708px 58px;
      }
      .scan-line {
        animation: scanMove 4s linear infinite;
      }
      .cursor-blink {
        animation: typeBlink 1s infinite;
      }
    </style>
  </defs>

  <!-- Card Base -->
  <rect width="850" height="150" rx="16" fill="url(#bgGrad)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3"/>
  <rect width="850" height="150" rx="16" fill="none" stroke="#34D399" stroke-width="1" stroke-opacity="0.5" class="pulsing-border"/>

  <!-- Scanning Top Radar Line -->
  <g clip-path="url(#cardClip)">
    <line x1="0" y1="2" x2="250" y2="2" stroke="url(#glowScan)" stroke-width="2" class="scan-line" />
  </g>

  <clipPath id="cardClip">
    <rect width="850" height="150" rx="16" />
  </clipPath>

  <!-- Left Accent Blade -->
  <rect x="28" y="28" width="4" height="94" rx="2" fill="url(#emeraldGrad)" />

  <!-- Main Name Header -->
  <text x="50" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="4" fill="#FFFFFF">
    SRIDHARSHINI S
  </text>

  <!-- Terminal Subtitle -->
  <text x="50" y="104" font-family="'Courier New', Consolas, Menlo, Monaco, monospace" font-size="13.5" font-weight="700" letter-spacing="2" fill="#34D399">
    CYBERSECURITY  //  PHYSICS-INFORMED AI  //  SYSTEMS ARCHITECTURE
  </text>
  <rect x="668" y="93" width="7" height="13" fill="#10B981" class="cursor-blink" />

  <!-- Node Telemetry Badge (Right) -->
  <g transform="translate(640, 42)">
    <rect width="170" height="34" rx="8" fill="#0A1811" stroke="#10B981" stroke-width="1" stroke-opacity="0.45"/>
    <circle cx="20" cy="17" r="4.5" fill="#10B981" class="radar-dot"/>
    <text x="34" y="21.5" font-family="'Courier New', Consolas, monospace" font-size="11" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">
      CIT · ONLINE
    </text>
  </g>

  <!-- Bottom Circuit Accent Line -->
  <line x1="30" y1="148" x2="820" y2="148" stroke="#10B981" stroke-width="1" stroke-opacity="0.25"/>
</svg>
