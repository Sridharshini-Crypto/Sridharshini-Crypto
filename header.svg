<svg width="850" height="155" viewBox="0 0 850 155" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="850" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040806" />
      <stop offset="50%" stop-color="#07120D" />
      <stop offset="100%" stop-color="#030604" />
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Glowing Scan Line Gradient -->
    <linearGradient id="glowScan" x1="0" y1="0" x2="850" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.85; }
      }
      @keyframes radarRipple {
        0% { r: 4.5px; opacity: 1; stroke-width: 1px; }
        100% { r: 12px; opacity: 0; stroke-width: 1.5px; }
      }
      @keyframes radarDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.9); }
      }
      @keyframes scanMove {
        0% { transform: translateX(-850px); }
        100% { transform: translateX(850px); }
      }
      @keyframes typeBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes cycleText1 {
        0%, 30% { opacity: 1; transform: translateY(0); }
        33%, 97% { opacity: 0; transform: translateY(-4px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes cycleText2 {
        0%, 30% { opacity: 0; transform: translateY(4px); }
        33%, 63% { opacity: 1; transform: translateY(0); }
        66%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      @keyframes cycleText3 {
        0%, 63% { opacity: 0; transform: translateY(4px); }
        66%, 97% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-4px); }
      }
      .pulsing-border {
        animation: pulseGlow 3.5s ease-in-out infinite;
      }
      .radar-center {
        animation: radarDot 2s ease-in-out infinite;
        transform-origin: 725px 58px;
      }
      .radar-ring {
        animation: radarRipple 2s cubic-bezier(0.1, 0.2, 0.7, 1) infinite;
        transform-origin: 725px 58px;
      }
      .scan-line {
        animation: scanMove 4s linear infinite;
      }
      .cursor-blink {
        animation: typeBlink 0.9s infinite;
      }
      .text-rotator-1 {
        animation: cycleText1 9s ease-in-out infinite;
      }
      .text-rotator-2 {
        animation: cycleText2 9s ease-in-out infinite;
      }
      .text-rotator-3 {
        animation: cycleText3 9s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Card Frame -->
  <rect width="850" height="155" rx="16" fill="url(#bgGrad)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3"/>
  <rect width="850" height="155" rx="16" fill="none" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.5" class="pulsing-border"/>

  <!-- Scanning Top Laser Sweep -->
  <g clip-path="url(#cardClip)">
    <line x1="0" y1="2" x2="300" y2="2" stroke="url(#glowScan)" stroke-width="2.5" class="scan-line" />
  </g>

  <clipPath id="cardClip">
    <rect width="850" height="155" rx="16" />
  </clipPath>

  <!-- Left Accent Blade -->
  <rect x="28" y="26" width="4.5" height="102" rx="2.2" fill="url(#emeraldGrad)" />

  <!-- Main Name Title -->
  <text x="50" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="4.5" fill="#FFFFFF">
    SRIDHARSHINI S
  </text>

  <!-- Animated Rotating Subtitle Telemetry Lines -->
  <g transform="translate(50, 105)">
    <!-- Line 1 -->
    <g class="text-rotator-1">
      <text font-family="'Courier New', Consolas, Menlo, monospace" font-size="13.5" font-weight="700" letter-spacing="1.8" fill="#34D399">
        CYBERSECURITY  //  AIR-GAPPED ZERO-TRUST  //  MITRE ATT&amp;CK
      </text>
    </g>
    <!-- Line 2 -->
    <g class="text-rotator-2">
      <text font-family="'Courier New', Consolas, Menlo, monospace" font-size="13.5" font-weight="700" letter-spacing="1.8" fill="#34D399">
        PHYSICS-INFORMED AI  //  TURBOJET DIGITAL TWINS  //  PINNs
      </text>
    </g>
    <!-- Line 3 -->
    <g class="text-rotator-3">
      <text font-family="'Courier New', Consolas, Menlo, monospace" font-size="13.5" font-weight="700" letter-spacing="1.8" fill="#34D399">
        SYSTEMS ARCHITECTURE  //  CYBER FUSION SOC  //  FULL-STACK
      </text>
    </g>
    <rect x="560" y="-11" width="7" height="14" fill="#10B981" class="cursor-blink" />
  </g>

  <!-- Right Node Status Telemetry Pill -->
  <g transform="translate(640, 42)">
    <rect width="170" height="34" rx="8" fill="#091710" stroke="#10B981" stroke-width="1" stroke-opacity="0.45"/>
    
    <!-- Concentric Pulsing Radar Rings -->
    <circle cx="22" cy="17" r="4.5" fill="none" stroke="#10B981" class="radar-ring" />
    <circle cx="22" cy="17" r="4.5" fill="#10B981" class="radar-center" />
    
    <text x="38" y="21.5" font-family="'Courier New', Consolas, monospace" font-size="11" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">
      CIT · ONLINE
    </text>
  </g>

  <!-- Bottom Circuit Accent Line with Scan Effect -->
  <line x1="30" y1="152" x2="820" y2="152" stroke="#10B981" stroke-width="1" stroke-opacity="0.25"/>
</svg>
