<svg width="850" height="215" viewBox="0 0 850 215" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad1" x1="0" y1="0" x2="415" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060F0B" />
      <stop offset="100%" stop-color="#040806" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="435" y1="0" x2="850" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060F0B" />
      <stop offset="100%" stop-color="#040806" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0" y1="0" x2="415" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="1" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.85; }
      }
      @keyframes scan1 {
        0% { transform: translateX(-420px); }
        100% { transform: translateX(420px); }
      }
      @keyframes scan2 {
        0% { transform: translateX(-420px); }
        100% { transform: translateX(420px); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.8); }
      }
      .card-border-pulse {
        animation: pulseGlow 3.5s ease-in-out infinite;
      }
      .laser-1 {
        animation: scan1 3.5s linear infinite;
      }
      .laser-2 {
        animation: scan2 3.5s linear 1.75s infinite;
      }
      .dot-pulse {
        animation: pulseDot 2s ease-in-out infinite;
      }
    </style>
    <clipPath id="clipCard1">
      <rect x="0" y="0" width="415" height="215" rx="12" />
    </clipPath>
    <clipPath id="clipCard2">
      <rect x="435" y="0" width="415" height="215" rx="12" />
    </clipPath>
  </defs>

  <!-- CARD 1: BAEONN -->
  <g transform="translate(0, 0)">
    <rect width="415" height="215" rx="12" fill="url(#cardGrad1)" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.35"/>
    <rect width="415" height="215" rx="12" fill="none" stroke="#34D399" stroke-width="1" stroke-opacity="0.5" class="card-border-pulse"/>
    
    <!-- Top Animated Laser Sweep -->
    <g clip-path="url(#clipCard1)">
      <line x1="0" y1="1.5" x2="180" y2="1.5" stroke="url(#laserGrad)" stroke-width="2.5" class="laser-1" />
    </g>

    <!-- Left accent bar -->
    <rect x="14" y="20" width="3.5" height="175" rx="1.75" fill="#10B981" />

    <!-- Role Title -->
    <text x="28" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">
      💼 Full Stack Developer Intern
    </text>

    <!-- Company / Location -->
    <text x="28" y="58" font-family="'Courier New', Consolas, monospace" font-size="12" font-weight="700" fill="#34D399" letter-spacing="0.5">
      Baeonn <tspan fill="#6EE7B7" font-weight="400">· Singapore (Virtual)</tspan>
    </text>

    <!-- Concrete Responsibilities List -->
    <g transform="translate(28, 80)">
      <!-- Bullet 1 -->
      <circle cx="3" cy="-4" r="2" fill="#10B981" />
      <text x="12" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#E2E8F0">
        <tspan font-weight="600" fill="#FFFFFF">Full-Stack Development:</tspan> Built modular React.js UI
      </text>
      <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#9CA3AF">
        components and responsive web application workflows.
      </text>

      <!-- Bullet 2 -->
      <circle cx="3" cy="36" r="2" fill="#10B981" />
      <text x="12" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#E2E8F0">
        <tspan font-weight="600" fill="#FFFFFF">API &amp; Backend Pipelines:</tspan> Integrated RESTful
      </text>
      <text x="12" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#9CA3AF">
        service endpoints and optimized client data fetching.
      </text>

      <!-- Bullet 3 -->
      <circle cx="3" cy="76" r="2" fill="#10B981" />
      <text x="12" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#E2E8F0">
        <tspan font-weight="600" fill="#FFFFFF">Agile Delivery:</tspan> Collaborated across international
      </text>
      <text x="12" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#9CA3AF">
        virtual sprints with Git version control and code reviews.
      </text>
    </g>

    <!-- Pill Tag -->
    <rect x="28" y="185" width="135" height="18" rx="4" fill="#0A1E14" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.5"/>
    <circle cx="36" cy="194" r="2.5" fill="#10B981" class="dot-pulse"/>
    <text x="44" y="197.5" font-family="'Courier New', Consolas, monospace" font-size="8.5" font-weight="700" fill="#A7F3D0">
      REACT · NODE · REST
    </text>
  </g>

  <!-- CARD 2: CLUB ASYMMETRIC (SECRETARY) -->
  <g transform="translate(435, 0)">
    <rect width="415" height="215" rx="12" fill="url(#cardGrad2)" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="0.35"/>
    <rect width="415" height="215" rx="12" fill="none" stroke="#60A5FA" stroke-width="1" stroke-opacity="0.5" class="card-border-pulse"/>

    <!-- Top Animated Laser Sweep -->
    <g clip-path="url(#clipCard2)">
      <line x1="0" y1="1.5" x2="180" y2="1.5" stroke="url(#laserGrad)" stroke-width="2.5" class="laser-2" />
    </g>

    <!-- Left accent bar -->
    <rect x="14" y="20" width="3.5" height="175" rx="1.75" fill="#3B82F6" />

    <!-- Role Title -->
    <text x="28" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">
      🛡️ Secretary
    </text>

    <!-- Company / Location -->
    <text x="28" y="58" font-family="'Courier New', Consolas, monospace" font-size="12" font-weight="700" fill="#60A5FA" letter-spacing="0.5">
      Club Asymmetric <tspan fill="#93C5FD" font-weight="400">· Chennai Inst. of Tech</tspan>
    </text>

    <!-- Concrete Responsibilities List -->
    <g transform="translate(28, 80)">
      <!-- Bullet 1 -->
      <circle cx="3" cy="-4" r="2" fill="#3B82F6" />
      <text x="12" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#E2E8F0">
        <tspan font-weight="600" fill="#FFFFFF">Operations &amp; Governance:</tspan> Directing technical
      </text>
      <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#9CA3AF">
        roadmaps, administrative workflows &amp; institutional reporting.
      </text>

      <!-- Bullet 2 -->
      <circle cx="3" cy="36" r="2" fill="#3B82F6" />
      <text x="12" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#E2E8F0">
        <tspan font-weight="600" fill="#FFFFFF">CTF &amp; Defense Events:</tspan> Orchestrating collegiate
      </text>
      <text x="12" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#9CA3AF">
        Capture The Flag tourneys, security labs &amp; hackathons.
      </text>

      <!-- Bullet 3 -->
      <circle cx="3" cy="76" r="2" fill="#3B82F6" />
      <text x="12" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#E2E8F0">
        <tspan font-weight="600" fill="#FFFFFF">Documentation &amp; Portals:</tspan> Managing technical
      </text>
      <text x="12" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#9CA3AF">
        writeups, challenge specs &amp; club platform development.
      </text>
    </g>

    <!-- Pill Tag -->
    <rect x="28" y="185" width="165" height="18" rx="4" fill="#0B1B2B" stroke="#3B82F6" stroke-width="0.8" stroke-opacity="0.5"/>
    <circle cx="36" cy="194" r="2.5" fill="#60A5FA" class="dot-pulse"/>
    <text x="44" y="197.5" font-family="'Courier New', Consolas, monospace" font-size="8.5" font-weight="700" fill="#BFDBFE">
      OPERATIONS · CTF · DOCS
    </text>
  </g>
</svg>
