<svg width="850" height="175" viewBox="0 0 850 175" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="honorsBg" x1="0" y1="0" x2="850" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050B08" />
      <stop offset="50%" stop-color="#07120D" />
      <stop offset="100%" stop-color="#040806" />
    </linearGradient>
    <linearGradient id="laserGradH" x1="0" y1="0" x2="850" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes pulseGlowH {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.75; }
      }
      @keyframes scanH {
        0% { transform: translateX(-850px); }
        100% { transform: translateX(850px); }
      }
      @keyframes badgePulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(0.95); }
      }
      .border-pulse-h {
        animation: pulseGlowH 3.5s ease-in-out infinite;
      }
      .scan-laser-h {
        animation: scanH 4.5s linear infinite;
      }
      .badge-glow {
        animation: badgePulse 2.5s ease-in-out infinite;
      }
    </style>
    <clipPath id="clipHonors">
      <rect width="850" height="175" rx="14" />
    </clipPath>
  </defs>

  <rect width="850" height="175" rx="14" fill="url(#honorsBg)" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.3"/>
  <rect width="850" height="175" rx="14" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4" class="border-pulse-h"/>

  <!-- Top Laser Sweep -->
  <g clip-path="url(#clipHonors)">
    <line x1="0" y1="1.5" x2="300" y2="1.5" stroke="url(#laserGradH)" stroke-width="2.5" class="scan-laser-h" />
  </g>

  <!-- Left Accent Bar -->
  <rect x="20" y="20" width="3.5" height="135" rx="1.75" fill="#F59E0B" />

  <!-- Item 1: HAL Aerothon -->
  <g transform="translate(36, 26)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">
      🏆 HAL × IIT Indore Aerothon 2026
    </text>
    <rect x="255" y="-12" width="170" height="20" rx="4" fill="#0A2216" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.6"/>
    <text x="263" y="2" font-family="'Courier New', Consolas, monospace" font-size="10" font-weight="700" fill="#34D399">
      TOP 25 NATIONAL FINALIST
    </text>
    <text x="435" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#9CA3AF">
      (out of 2,300+ teams across India)
    </text>
  </g>

  <!-- Item 2: Smart Horizon -->
  <g transform="translate(36, 56)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">
      🌐 Smart Horizon International 2026
    </text>
    <rect x="278" y="-12" width="160" height="20" rx="4" fill="#0A2216" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.6"/>
    <text x="286" y="2" font-family="'Courier New', Consolas, monospace" font-size="10" font-weight="700" fill="#34D399">
      GRAND FINALE FINALIST
    </text>
    <text x="448" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#9CA3AF">
      Global Cybersecurity Challenge
    </text>
  </g>

  <!-- Item 3: Microsoft Agents League -->
  <g transform="translate(36, 86)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">
      🤖 Microsoft Agents League
    </text>
    <rect x="215" y="-12" width="180" height="20" rx="4" fill="#151A2E" stroke="#6366F1" stroke-width="0.8" stroke-opacity="0.6"/>
    <text x="223" y="2" font-family="'Courier New', Consolas, monospace" font-size="10" font-weight="700" fill="#A5B4FC">
      REASONING AGENTS TRACK
    </text>
    <text x="405" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#9CA3AF">
      Autonomous Verification Agents
    </text>
  </g>

  <!-- Item 4: Academics -->
  <g transform="translate(36, 116)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">
      🎓 Academic Distinction
    </text>
    <rect x="180" y="-12" width="145" height="20" rx="4" fill="#20150A" stroke="#F59E0B" stroke-width="0.8" stroke-opacity="0.6"/>
    <text x="188" y="2" font-family="'Courier New', Consolas, monospace" font-size="10" font-weight="700" fill="#FCD34D">
      SCHOOL 1ST RANK
    </text>
    <text x="335" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#9CA3AF">
      Class XII (97% · 583/600) &amp; Class X (95% · 475/500)
    </text>
  </g>

  <!-- Item 5: Chess -->
  <g transform="translate(36, 146)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">
      ♟️ Strategic Foundation
    </text>
    <rect x="185" y="-12" width="155" height="20" rx="4" fill="#121820" stroke="#0284C7" stroke-width="0.8" stroke-opacity="0.6"/>
    <text x="193" y="2" font-family="'Courier New', Consolas, monospace" font-size="10" font-weight="700" fill="#7DD3FC">
      DISTRICT-LEVEL CHESS
    </text>
    <text x="350" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#9CA3AF">
      Competitive Tactical Planning &amp; Positional Forensics
    </text>
  </g>
</svg>

